  description: The SC Bach Choir and Soloists, along with the NC Baroque Orchestra
    (NCBO), will perform "Masterworks for Advent" featuring the music of J.S. Bach
    and Vivaldi. The opening motet, "Komm, Jesu, komm," features a double choir singing
    intertwined harmonies and taking turns with the stunning melodies for which Bach's
    choral music is perhaps best known. Carrera Stamile, SC Bach's first Young Artist
    Competition winner, will join the NCBO to perform a mandolin concerto by Vivaldi.
    Ms. Stamile, an undergraduate student at Converse University, is a virtuosic talent,
    with the musicality and professionalism of a performer far beyond her years. To
    close the concert, the SC Bach Choir and soloists will perform one of Bach's most
    famous cantatas, "Wachet auf, ruft uns die Stimme," also known as "Sleepers, awake"
    in English.
